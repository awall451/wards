# Layer 0: keep secrets out of a public repo.
#
# Wards exists to stop an agent doing damage in a cloud account. This stops a
# credential reaching a public git history in the first place — the one failure
# the other six layers cannot undo, because published history must be assumed
# cloned before it is scrubbed.
#
# Install once per clone:
#     pre-commit install
#
# Scan everything, including before a first public push:
#     pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
